<title>My OS</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
  /* Near black, soft glows, glassy cards. */
  :root{
    color-scheme:dark;
    --bg:#09090B; --card:rgba(24,24,27,.74); --card-2:rgba(18,18,21,.96); --inset:rgba(9,9,11,.55);
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --tx:#FAFAFA; --tx-2:#D4D4D8; --tx-3:#A1A1AA; --tx-4:#71717A;
    --amber:#F59E0B; --amber-2:#FCD34D; --violet:#A78BFA; --violet-bg:rgba(139,92,246,.16);
    --green:#4ADE80; --green-bg:rgba(34,197,94,.14); --rose:#F43F5E; --rose-2:#FDA4AF; --blue:#60A5FA; --teal:#2DD4BF;
    --orange:#FB923C; --orange-bg:rgba(249,115,22,.14); --yellow:#FACC15;
    --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
    --r:18px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14.5px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .glow{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(24px)}
  .g1{left:-140px;top:-180px;width:600px;height:520px;background:radial-gradient(closest-side,rgba(126,34,206,.5),rgba(126,34,206,0))}
  .g2{left:30%;top:10%;width:520px;height:380px;background:radial-gradient(closest-side,rgba(217,119,6,.18),rgba(217,119,6,0))}
  .g3{right:-200px;bottom:-240px;width:700px;height:600px;background:radial-gradient(closest-side,rgba(14,116,144,.45),rgba(14,116,144,0))}

  /* frame */
  .side{position:fixed;z-index:5;left:16px;top:16px;bottom:16px;width:60px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:22px}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--tx);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .nav{margin-top:auto;margin-bottom:auto;display:flex;flex-direction:column;gap:20px;align-items:center}
  .nav a,.nav button{appearance:none;background:none;border:0;padding:6px;color:var(--tx-4);display:flex;border-radius:10px;position:relative}
  .nav a:hover,.nav button:hover{color:var(--tx)} .nav .on{color:var(--tx)}
  .nav .on::after{content:"";position:absolute;right:-2px;top:2px;width:6px;height:6px;border-radius:50%;background:var(--violet)}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#F59E0B,#B45309);color:var(--bg);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
  .main{position:relative;z-index:1;margin-left:92px;padding:24px 24px 48px;max-width:1440px}
  .tabs{display:none}

  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .hello{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
  .sub{font-size:13.5px;color:var(--tx-3);margin-top:6px}
  .pills{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap}
  .pill i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--tx-4))}
  button.pill:hover{border-color:var(--line-2)}

  .askbar{margin-top:18px;display:flex;gap:8px;align-items:center}
  .ask{flex:1 1 auto;min-width:0;max-width:640px;display:flex;align-items:center;gap:10px;height:46px;padding:0 6px 0 16px;border-radius:14px;background:var(--card-2);border:1px solid var(--line-2)}
  .ask:focus-within{border-color:var(--violet)}
  .ask svg{flex:0 0 auto;color:var(--tx-3)}
  #find{flex:1 1 auto;min-width:0;background:none;border:0;outline:none;font-size:15px}
  #find::placeholder{color:var(--tx-4)}
  .kbd{font:500 11px var(--mono);color:var(--tx-4);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px}
  .go{height:34px;padding:0 14px;border-radius:10px;border:0;background:var(--tx);color:var(--bg);font-weight:600;font-size:13.5px}
  .ghost{height:46px;padding:0 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px}
  .ghost:hover{border-color:var(--line-2)}

  .fresh{margin-top:16px;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:linear-gradient(100deg,rgba(76,29,149,.45),rgba(24,24,27,.8));border:1px solid rgba(167,139,250,.3);font-size:14px}
  .fresh b{font-weight:600}

  /* the grid */
  .grid{margin-top:20px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px;
    grid-template-areas:
      "now now now now now now now jar jar jar jar jar"
      "foc foc foc foc foc foc foc wor wor wor wor wor"
      "flo flo flo flo pra pra pra pra ahe ahe ahe ahe"
      "hea hea hea hea dea dea dea dea par par par par"
      "acc acc acc acc acc acc acc acc acc acc acc acc"}
  .card{position:relative;border-radius:var(--r);background:var(--card);border:1px solid var(--line);padding:22px 24px;min-width:0}
  .a-now{grid-area:now} .a-jar{grid-area:jar} .a-foc{grid-area:foc} .a-flo{grid-area:flo} .a-dea{grid-area:dea} .a-pra{grid-area:pra} .a-ahe{grid-area:ahe} .a-par{grid-area:par} .a-hea{grid-area:hea} .a-bra{grid-area:bra} .a-wor{grid-area:wor} .a-pln{grid-area:pln} .a-acc{grid-area:acc}
  .ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .ct{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600}
  .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--ib);color:var(--if)}
  .meta{font-size:12.5px;color:var(--tx-4)}
  .tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--tb);color:var(--tf);white-space:nowrap}
  .lnk{appearance:none;background:none;border:0;padding:0;font-size:13px;color:var(--tx-3)}
  .lnk:hover{color:var(--tx)}

  /* now */
  .a-now{background:linear-gradient(150deg,rgba(120,53,15,.5),rgba(24,24,27,.9) 58%);border-color:rgba(245,158,11,.32);display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:18px;align-items:center}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--amber-2)}
  .now-t{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:12px;overflow-wrap:anywhere}
  .now-s{font-size:14.5px;color:var(--tx-2);margin-top:8px}
  .now-b{display:flex;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
  .start{height:48px;padding:0 22px;border-radius:12px;border:0;background:var(--amber);color:#1C1003;font-weight:600;font-size:15.5px;display:inline-flex;align-items:center;gap:10px}
  .start:hover{background:#FBBF24}
  .soft{height:40px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--tx-2);font-weight:500;font-size:13.5px}
  .soft:hover{border-color:var(--line-2);color:var(--tx)}
  .ring{width:150px;height:150px;position:relative}
  .ring svg{width:150px;height:150px;transform:rotate(-90deg)}
  .ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .ring .rv b{font-size:30px;font-weight:600;letter-spacing:-.02em}
  .ring .rv span{font-size:11.5px;color:var(--tx-3);margin-top:2px}

  /* focus */
  .fi{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .fi:last-child{border-bottom:0}
  .box{width:20px;height:20px;border-radius:6px;border:1.5px solid #52525B;background:none;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0}
  .box:hover{border-color:var(--violet)}
  .fi .tx{flex:1 1 auto;min-width:0} .fi .tx b{display:block;font-size:15px;font-weight:500;overflow-wrap:anywhere} .fi .tx span{font-size:12.5px;color:var(--tx-4)}
  .fi select{background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;color:var(--tx-3)}
  .fi .x{appearance:none;background:none;border:0;color:var(--tx-4);font-size:18px;line-height:1;padding:4px}
  .fi .x:hover{color:var(--tx)}
  .sugg{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .chipb{appearance:none;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:13px;color:var(--tx-2);max-width:100%}
  .chipb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chipb i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--tx-4));flex:0 0 auto}
  .chipb:hover{border-color:var(--line-2);color:var(--tx)}
  .add{margin-top:12px;display:flex;gap:8px}
  .add input,.field{flex:1 1 auto;min-width:0;height:40px;padding:0 12px;border-radius:10px;background:var(--inset);border:1px solid var(--line);outline:none;font-size:14px}
  .add input:focus,.field:focus{border-color:var(--violet)}
  .full{margin-top:12px;font-size:13px;color:var(--tx-3)}

  /* floor */
  .fl-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .fl{appearance:none;height:64px;border-radius:12px;background:var(--inset);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--tx-3);padding:4px}
  .fl svg{opacity:.35}
  .fl.on{background:var(--fb);border-color:var(--fc);color:var(--tx)}
  .fl.on svg{opacity:1;color:var(--fc)}
  .wk{margin-top:16px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:11px;color:var(--tx-4)}
  .wk i{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.1)}
  .wk i.h{background:var(--rose)} .wk i.p{background:rgba(244,63,94,.4)} .wk .t{color:var(--tx)}
  .big{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .fl-foot{margin-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}

  /* lists */
  .li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .li:last-child{border-bottom:0}
  .li .d{font-size:14px;font-weight:600;white-space:nowrap}
  .deal{padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  .deal:last-child{border-bottom:0}
  .deal span{font-size:14px;line-height:1.4}
  .edit{margin-top:8px;display:flex;flex-direction:column;gap:8px}
  .edit textarea{min-height:60px;padding:10px 12px;border-radius:10px;background:var(--inset);border:1px solid var(--line);outline:none;resize:vertical;font-size:14px}
  .edit .row2{display:flex;gap:8px;justify-content:flex-end}
  .pk{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pkc{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:13px;color:var(--tx-2)}
  .pkc button{appearance:none;background:none;border:0;color:var(--tx-4);padding:2px 6px;font-size:12px}
  .pkc button:hover{color:var(--tx)}

  .pr{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
  .pr div{border-radius:10px;background:var(--inset);border:1px solid var(--line);padding:9px 4px;text-align:center}
  .pr div.nx{border-color:rgba(245,158,11,.55);background:rgba(245,158,11,.1)}
  .pr small{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-4)}
  .pr b{display:block;font-size:14.5px;font-weight:600;margin-top:3px}

  .bar{margin-top:6px;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;background:var(--c)}
  .hs{display:flex;flex-direction:column;gap:16px}
  .hs .l{display:flex;justify-content:space-between;font-size:13.5px}
  .hs .l span{color:var(--tx-3)}

  .a-jar{background:linear-gradient(160deg,rgba(30,58,138,.45),rgba(24,24,27,.9) 60%);border-color:rgba(96,165,250,.26);display:flex;flex-direction:column}
  .jline{font-size:17px;font-weight:500;line-height:1.5;margin-top:14px;min-height:52px}
  .dotlive{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue)}
  .a-bra{background:linear-gradient(160deg,rgba(76,29,149,.42),rgba(24,24,27,.9) 60%);border-color:rgba(167,139,250,.25);display:flex;flex-direction:column}
  .bra-b{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:16px}
  .open{height:38px;padding:0 16px;border-radius:999px;border:0;background:var(--tx);color:var(--bg);font-weight:600;font-size:13.5px;text-decoration:none;display:inline-flex;align-items:center}

  .wbars{margin-top:16px;height:92px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}
  .wb{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:11px;color:var(--tx-4)}
  .wb i{display:block;width:100%;max-width:34px;border-radius:4px 4px 0 0;background:rgba(74,222,128,.35);min-height:0}
  .wb.t i{background:var(--green)} .wb.t{color:var(--tx)}
  .wb i.z{height:3px!important;background:rgba(255,255,255,.1)}
  .ring .rv b.sm{font-size:23px}
  .night{overflow-y:auto}
  @media (max-width:760px){.ring .rv b.sm{font-size:15px}}
  .fresh svg{color:var(--violet);flex:0 0 auto}
  .a-bra{flex-direction:row;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap} .a-bra .ch{margin:0} .a-bra .bra-b{margin:0;padding:0}
  .pl-sum{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px;color:var(--tx-3);margin:-4px 0 12px} .pl-sum b{color:var(--tx);font-weight:600}
  .agenda{display:flex;flex-direction:column}
  .ag{display:grid;grid-template-columns:46px 20px minmax(0,1fr);gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .ag:last-child{border-bottom:0}
  .ag .tm{font:500 12px var(--mono);color:var(--tx-4);padding-top:2px}
  .ag .tt{font-size:14px;line-height:1.45;overflow-wrap:anywhere} .ag .tt i{font-style:normal;font-size:11.5px;font-weight:600;letter-spacing:.04em;margin-right:4px}
  .ag.fx .tt{color:var(--tx-4)} .ag.off .tt{text-decoration:line-through}
  .ag.done .tt{color:var(--tx-4);text-decoration:line-through}
  .ag.now{background:rgba(245,158,11,.08);border-radius:10px;margin:0 -8px;padding:9px 8px}
  .ag.over .tt{color:#FECDD3}
  .dotp{width:8px;height:8px;border-radius:50%;margin:6px 6px 0}
  .nowb,.overb{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:5px;margin-left:4px;white-space:nowrap}
  .nowb{background:rgba(245,158,11,.2);color:var(--amber-2)} .overb{background:rgba(244,63,94,.18);color:var(--rose-2)}
  .acc-g{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:18px}
  .rep{margin-top:6px;font-size:13.5px;line-height:1.5;color:var(--tx-2);background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:10px 12px;user-select:all}
  .miss{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)} .miss .tt{font-size:14px;margin-bottom:8px}
  .rs{display:flex;flex-wrap:wrap;gap:6px}
  .rb{height:34px;padding:0 12px;border-radius:999px;background:var(--inset);border:1px solid var(--line);color:var(--tx-3);font-size:12.5px}
  .rb.on{background:rgba(129,140,248,.18);border-color:rgba(129,140,248,.6);color:#E0E7FF}
  .rb.fine.on{background:rgba(244,63,94,.18);border-color:rgba(244,63,94,.6);color:#FECDD3}
  @media (max-width:760px){.acc-g{grid-template-columns:minmax(0,1fr)}}
  .toast{position:fixed;z-index:60;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;transition:all .2s var(--ease);background:var(--card-2);border:1px solid var(--line-2);border-radius:12px;padding:10px 16px;font-size:13.5px;pointer-events:none}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* overlays */
  .ov{position:fixed;inset:0;z-index:50;background:rgba(5,5,7,.86);display:flex;align-items:center;justify-content:center;padding:16px}
  .ov[hidden]{display:none}
  .ov .box2{width:min(440px,100%);border-radius:20px;background:var(--card-2);border:1px solid var(--line-2);padding:26px}
  .ov h3{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em}
  .ov p{color:var(--tx-3);margin:8px 0 0}
  .night{background:#050507;align-items:stretch}
  .night .box2{border:0;background:none;display:flex;flex-direction:column;max-width:440px;margin:0 auto;padding:40px 8px calc(24px + env(safe-area-inset-bottom,0px))}
  .ngrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
  .nb{height:48px;border-radius:12px;background:var(--inset);border:1px solid var(--line);color:var(--tx-3);font-weight:500;padding:0 14px;text-align:left}
  .nb.on{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.5);color:var(--amber-2)}
  .nlab{margin-top:22px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-4)}
  .phone-out{margin-top:24px;height:54px;border-radius:14px;border:0;background:var(--tx);color:var(--bg);font-weight:600;font-size:16px}

  /* capture popover */
  .cap textarea{width:100%;min-height:96px;margin-top:14px;padding:12px;border-radius:12px;background:var(--inset);border:1px solid var(--line-2);outline:none;resize:vertical;font-size:15px}
  .cap .row2{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

  /* the sheet: search answers and reading brain pages */
  .panel{position:fixed;z-index:40;left:0;right:0;bottom:0;height:88vh;height:88dvh;background:var(--card-2);border-top:1px solid var(--line-2);border-radius:22px 22px 0 0;transform:translateY(106%);transition:transform .3s var(--ease);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -30px 90px -30px rgba(0,0,0,.95)}
  .panel.open{transform:none}
  .grip{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:9px auto 0;flex:0 0 auto}
  .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:10px 22px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .crumb{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--tx-4)}
  .ph h2{font-weight:600;font-size:28px;letter-spacing:-.02em;margin:6px 0 0;line-height:1.1;overflow-wrap:anywhere}
  .ph .tag{background:none;padding:0;margin-top:8px;color:var(--c);gap:7px} .ph .tag i{width:7px;height:7px;border-radius:50%;background:var(--c)}

  if(CFG.prayer&&CFG.lat){P=PT(TODAY);var Y=PT(addDays(TODAY,-1)),T=PT(addDays(TODAY,1));
    if(h<P.fajr)w={key:"night",name:"Before Fajr",from:Y.isha-24,to:P.fajr};else if(h<P.sunrise)w={key:"fajr",name:"Fajr window",from:P.fajr,to:P.sunrise};else if(h<P.dhuhr)w={key:"morning",name:"Morning",from:P.sunrise,to:P.dhuhr};else if(h<P.asr)w={key:"dhuhr",name:"Dhuhr window",from:P.dhuhr,to:P.asr};else if(h<P.maghrib)w={key:"asr",name:"Asr window",from:P.asr,to:P.maghrib};else if(h<P.isha)w={key:"maghrib",name:"Maghrib window",from:P.maghrib,to:P.isha};else w={key:"isha",name:"Isha window",from:P.isha,to:T.fajr+24};
    var order=[["fajr","Fajr"],["dhuhr","Dhuhr"],["asr","Asr"],["maghrib","Maghrib"],["isha","Isha"]];for(var i=0;i<order.length;i++){if(P[order[i][0]]>h){next={key:order[i][0],name:order[i][1],at:P[order[i][0]]};break;}}if(!next)next={key:"fajr",name:"Fajr",at:T.fajr+24};}
  else{var hh=h<wake-2?h+24:h;if(hh<12)w={key:"morning",name:"Morning",from:wake,to:12};else if(hh<17)w={key:"afternoon",name:"Afternoon",from:12,to:17};else if(hh<bed)w={key:"evening",name:"Evening",from:17,to:bed};else w={key:"night",name:"Night",from:bed,to:wake+24};h=hh;next={key:"bed",name:"Bedtime",at:bed};}
  w.left=w.to-h;w.frac=Math.min(1,Math.max(0,(w.to-h)/(w.to-w.from)));
  var hb=NOW.h<wake-2?NOW.h+24:NOW.h,bedtime=hb>=bed-0.25||NOW.h<wake-1.5;
  return{P:P,w:w,next:next,bedtime:bedtime,wakeAt:CFG.prayer&&P?(NOW.h<P.fajr?P.fajr:PT(addDays(TODAY,1)).fajr):wake};}
var ANCH=CFG.prayer?[["fajr","After Fajr"],["morning","Morning"],["dhuhr","After Dhuhr"],["asr","After Asr"],["maghrib","After Maghrib"],["isha","After Isha"],["any","Any time"]]:[["morning","Morning"],["afternoon","Afternoon"],["evening","Evening"],["any","Any time"]];

function longDate(iso){return new Date(iso+"T12:00:00Z").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"});}
function shortDate(iso){return new Date(iso+"T12:00:00Z").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"});}
function shortWhat(t){t=stripMd(t);var a=t.split(/(?:\.\s|\s\(|;\s)/)[0];if(a.length>72){a=a.slice(0,72);a=a.slice(0,a.lastIndexOf(" "))+"…";}return a;}

/* ---------- state: this page's database, or this browser if the database is off ---------- */

/* ---------- ask the brain: search every page, then let Claude say what it adds up to ---------- */
var SKIP_TOP={"skills":1,".claude":1,"mcp":1,"archive":1,"node_modules":1,".github":1};

/* a copy of every readable page, filled once per visit, most useful folders first */

    if(ok||id!==srch.id)return;

/* the prompt: what Claude reads. Only the passages found, nothing else. */

    h.items.forEach(function(it){var t=it.b.text.replace(/\s+\n/g,"\n").slice(0,1600);var line=(t.charAt(0)==="-"?"":"- ")+t+"\n",lb=enc.encode(line).length;if(used+lb+(added?0:hb)>budget){left++;return;}if(!added){parts.push(headLine);used+=hb;added=true;}parts.push(line);used+=lb;});});
  return "The owner typed this into the search box of their personal second brain: \""+q+"\""+(srch.about?" ("+srch.about+")":"")+"\n\n"+
    "If it is a question, answer it directly first. Then tell them what else their brain holds that bears on it, using ONLY the passages below. The pages may speak of them in the third person, so \"their father\" or \"his father\" in a page is the \"my father\" they asked about. They come from dated markdown notes kept by them and their AI agents, grouped by page.\n\n"+
    "How to write it:\n"+
    "- Speak to them directly as \"you\".\n"+
    "- Open with one or two plain sentences that sum it up.\n"+
    "- Then a few short sections, each starting with a bold label, in time order where time matters, keeping the dates the notes give.\n"+
    "- Most lines start with the date they were written. When a newer line corrects an older one, the newer one wins; say what changed.\n"+
    "- After each point put its page in square brackets exactly as written after ###, for example [people/sam.md].\n"+
    "- If the passages are about more than one person or thing with a similar name, keep them apart.\n"+
    "- Finish with one short line on what the brain does not know yet, only if something obvious is missing.\n"+
    "- Plain words and short sentences. No dashes as punctuation. Nothing invented. Under 350 words.\n\n"+

var CITE=/\[((?:[A-Za-z0-9_.\-]+\/)*[A-Za-z0-9_.\-]+\.md)\]/g;

var FOLDERS="people/ one page per person; identity/ about-me, growth, vision; records/ family, health, travel, money; memory/ people, projects, learnings; context/ dates, habits, boundaries, open-loops; diary/YYYY/MM/ daily entries; agents/<name>/ each agent's notes and runs; chief/ board, questions, inbox; outputs/ plans and reports";

    var paths=corpus.paths.length?corpus.paths.join("\n"):"(page list still loading) "+FOLDERS;

function runSearch(q){

  var id=++srch.id;srch.q=q;srch.words=wordsOf(q);srch.res=wordRes(srch.words);srch.hits={};srch.pick={};srch.about="";srch.phase="gather";srch.via="";srch.read=0;srch.total=0;
  var s1=sec("Answer");s1.id="s-ans";var a=document.createElement("div");a.className="answer";a.id="s-answer";a.innerHTML=progressHTML();s1.appendChild(a);var act=document.createElement("div");act.className="actions";act.id="s-act";s1.appendChild(act);
  var s3=sec("Where it comes from","");s3.querySelector(".sk b").id="s-count";var src=document.createElement("div");src.id="s-src";s3.appendChild(src);
  findEl.blur();
  a.innerHTML='<div class="thinking"><div class="l"><b class="pulse" style="font-weight:500">Understanding your question</b><span>a few seconds</span></div><div class="track"><i style="width:30%"></i></div></div>';
  if(!srch.fast)ensureCorpus();
  understand(q).then(function(u){if(id!==srch.id)return;srch.words=u.terms;srch.res=wordRes(u.terms);srch.about=u.about;u.pages.forEach(function(p){srch.pick[p]=1;});
    var lk=document.createElement("div");lk.className="note";lk.style.margin="0 0 10px";lk.innerHTML="Looking for "+u.terms.slice(0,10).map(function(t){return"<b style=\"color:var(--tx-2);font-weight:500\">"+esc(t)+"</b>";}).join(", ")+(u.pages.length?" \u00b7 reading "+u.pages.length+" likely pages first":"");s1.insertBefore(lk,a);
    u.pages.forEach(function(p){if(corpus.files[p]==null)readFileRetry(p).then(function(t){corpus.files[p]=corpus.files[p]||t;if(id===srch.id){var r=matchFile(p,t,srch.res);if(r.items.length)srch.hits[p]=r;scheduleSrc(id);}},function(){});});
    return gather(id);
  }).then(function(){if(id!==srch.id)return;srch.phase="done";if(srch.timer){clearTimeout(srch.timer);srch.timer=null;}renderSearch();
    var hits=rankedHits(),n=0;hits.forEach(function(h){n+=h.items.length;});el("p-status").textContent=n?n+" passage"+(n===1?"":"s")+" in "+hits.length+" page"+(hits.length===1?"":"s"):"nothing found";
    if(srch.via==="crawl"&&corpus.failed){var nt=document.createElement("div");nt.className="note";nt.style.marginTop="8px";nt.textContent=corpus.failed+" page"+(corpus.failed===1?"":"s")+" could not be read this time.";el("s-src").appendChild(nt);}
    askClaude(id,q,"quick");
  });
}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest(".cite");if(b){e.preventDefault();showFile(b.getAttribute("data-p"),null,srch.words);}});

/* ---------- taps ---------- */
var panel=el("panel"),body=el("p-body"),reader=el("reader"),findEl=el("find");
function byId(list,id){return list.filter(function(x){return x.id===id;})[0];}
document.addEventListener("click",function(e){
  var t=e.target.closest&&e.target.closest("[data-a],[data-go],[data-jot],[data-close-day]");if(!t)return;
  if(t.hasAttribute("data-go")){var s=el(t.getAttribute("data-go"));if(s){s.scrollIntoView({behavior:"smooth",block:"start"});var i=s.querySelector("input");if(i&&t.getAttribute("data-go")==="focus")setTimeout(function(){i.focus({preventScroll:true});},450);}return;}
  if(t.hasAttribute("data-jot")){el("capture").hidden=false;el("cp-text").focus();return;}
  if(t.hasAttribute("data-close-day")){showNight(true);return;}
  var a=t.getAttribute("data-a"),id=t.getAttribute("data-id");
  switch(a){
    case"t-start":startTimer(10);break;
    case"t-more":if(S.timer){S.timer.minutes=Math.ceil((Date.now()-S.timer.startedAt)/60000)+25;S.timer.rang=false;save("timer");renderAll();}break;
    case"t-log":logBlock(false);break;
    case"t-done":logBlock(true);break;
    case"t-cancel":S.timer=null;save("timer");renderAll();break;
    case"swap":swapIx++;var open=S.focus.filter(function(f){return!f.doneOn;}),it=open[swapIx%open.length];if(it){el("now").querySelector(".now-t").textContent=it.text;el("now").querySelector(".now-s").textContent=ANCH_L[it.anchor||"any"];}break;
    case"brief":openPanel("Today","Your diary","",HEX.brass);showFile(diaryPath(LDAY));break;
    case"coach":askCoach();break;
    case"tick":var f=byId(S.focus,id);if(f){f.doneOn=f.doneOn?null:LDAY;save("focus");if(f.doneOn){diary("Done: "+f.text+".");toast("Ticked off. "+S.focus.filter(function(x){return!x.doneOn;}).length+" left.");}renderAll();}break;
    case"drop":S.focus=S.focus.filter(function(x){return x.id!==id;});save("focus");renderAll();break;
    case"sugg":var sg=suggestions()[+t.getAttribute("data-i")];if(sg)addFocus(sg);break;
    case"promote":var p=byId(S.parking,id);if(!p)break;if(S.focus.filter(function(f){return!f.doneOn;}).length>=3){toast("Focus is full. Finish or drop one first.");break;}S.parking=S.parking.filter(function(x){return x.id!==id;});save("parking");addFocus({text:p.text});break;
    case"unpark":S.parking=S.parking.filter(function(x){return x.id!==id;});save("parking");renderAll();break;
    case"floor":toggleFloor(t.getAttribute("data-k"));break;
    case"prog":var ix=+t.getAttribute("data-i"),pr=CFG.progress[ix];if(pr){var v=(S.progress[ix]!=null?S.progress[ix]:+pr.value||0)+1;S.progress[ix]=Math.min(+pr.of||v,v);save("progress");diary(pr.label+": "+S.progress[ix]+" of "+pr.of+".");renderAll();}break;
    case"deal-add":editing="new";renderDeals();break;
    case"deal-edit":editing=id;renderDeals();var ta=el("deals").querySelector("textarea");if(ta)ta.focus();break;
    case"deal-cancel":editing=null;renderDeals();break;
    case"deal-del":var fm=t.closest("form"),r=fm.r.value.trim();if(r.length<15){toast("Give a real reason first. One sentence.");fm.r.focus();break;}var old=byId(S.deals,id);S.deals=S.deals.filter(function(x){return x.id!==id;});save("deals");diary("Rule dropped: "+(old?old.text:"")+". Reason: "+r);editing=null;renderAll();break;
    case"nfloor":toggleFloor(t.getAttribute("data-k"));showNight(true);break;
    case"nres":nightSel["r:"+id]=t.getAttribute("data-r");renderNight();break;
    case"nfirst":nightSel.first=t.getAttribute("data-t");renderNight();break;
    case"night-close":closeDay();break;
    case"night-x":el("night").hidden=true;el("night").dataset.auto="";peekUntil=Date.now()+15*60000;break;
    case"night-peek":var n=5;t.disabled=true;t.textContent="Unlocking in 5";var iv=setInterval(function(){n--;if(n>0){t.textContent="Unlocking in "+n;return;}clearInterval(iv);peekUntil=Date.now()+15*60000;el("night").hidden=true;toast("15 minutes. Then phone away.");},1000);break;
    case"fine-paid":var ow=fineOwed();if(!ow)break;S.fines.paid=(S.fines.paid||[]).concat([{date:LDAY,amt:ow}]);save("fines");diary("Gave "+money(ow)+" to charity for missed focus.");toast("Paid. Clean slate.");renderAll();break;
    case"copy-rep":var txt=weekReport();(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast("Copied.");},function(){var rg=document.createRange();rg.selectNodeContents(el("rep"));var sl=window.getSelection();sl.removeAllRanges();sl.addRange(rg);toast("Selected. Copy it from here.");});break;
  }
});
document.addEventListener("change",function(e){var t=e.target;if(t.getAttribute("data-a")==="anchor"){var f=byId(S.focus,t.getAttribute("data-id"));if(f){f.anchor=t.value;save("focus");renderNow();}}});
document.addEventListener("submit",function(e){var f=e.target,a=f.getAttribute("data-a");if(!a)return;e.preventDefault();
  if(a==="add-focus"){var v=f.t.value.trim();if(v)addFocus({text:v});}
  else if(a==="park"){var p=f.t.value.trim();if(p){S.parking.push({id:uid(),text:p});save("parking");renderAll();}}
  else if(a==="deal-save"){var tx=f.t.value.trim(),r=f.r.value.trim(),id=f.getAttribute("data-id");if(!tx)return;if(r.length<15){toast("Give a real reason first. One sentence.");f.r.focus();return;}
    if(id==="new"){S.deals.push({id:uid(),text:tx});diary("New rule: "+tx+". Reason: "+r);}else{var d=byId(S.deals,id);if(d){diary("Rule changed from \""+d.text+"\" to \""+tx+"\". Reason: "+r);d.text=tx;}}
    save("deals");editing=null;renderAll();toast("Saved. The reason is in your diary.");}
});
el("askform").addEventListener("submit",function(e){e.preventDefault();var q=findEl.value.trim();if(!q)return;if(!mcpRef){toast("Connect your brain first: in Claude Code say \"connect my brain everywhere\".");return;}runSearch(q);});
el("p-close").addEventListener("click",closePanel);
el("r-back").addEventListener("click",function(){reader.classList.remove("open");if(!body.innerHTML)closePanel();});
el("jot").addEventListener("click",function(){el("capture").hidden=false;el("cp-text").focus();});
el("cp-x").addEventListener("click",function(){el("capture").hidden=true;});
document.querySelectorAll("[data-cap]").forEach(function(b){b.addEventListener("click",function(){capture(b.getAttribute("data-cap"));});});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){if(!el("capture").hidden)el("capture").hidden=true;else if(panel.classList.contains("open")){if(reader.classList.contains("open")&&body.innerHTML)reader.classList.remove("open");else closePanel();}return;}
  var tag=(document.activeElement&&document.activeElement.tagName)||"";if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  if(e.key==="/"){e.preventDefault();findEl.focus();}else if(e.key==="j"){e.preventDefault();el("capture").hidden=false;el("cp-text").focus();}
});

(function(){var i=(CFG.name||"").trim().charAt(0).toUpperCase()||"◆";el("logo").textContent=i;el("avatar").textContent=i;if(CFG.name)document.title=CFG.name.split(" ")[0]+"'s OS";})();
renderAll();showNight(false);

if(window.claude&&window.claude.use){
  window.claude.use("db").then(function(db){if(!db)return;dbRef=db;var first=true;
    db.collection("os").onSnapshot(function(q){var seen={};q.docs.forEach(function(d){if(!d.exists)return;var v=d.data()||{};seen[d.id]=1;if(LISTS[d.id])S[d.id]=Array.isArray(v.items)?v.items:[];else if(d.id==="timer")S.timer=v.startedAt?v:null;else if(d.id in S)S[d.id]=v;lsSet("os/"+d.id,v);});
      if(first){first=false;["focus","parking"].forEach(function(k){if(!seen[k]&&S[k].length)save(k);});}renderAll();},function(){});
    db.collection("floor").onSnapshot(function(q){q.docs.forEach(function(d){if(d.exists)S.floor[d.id]=d.data()||{};});lsSet("floor",S.floor);renderAll();},function(){});
    db.collection("blocks").onSnapshot(function(q){q.docs.forEach(function(d){if(d.exists)S.blocks[d.id]=(d.data()||{}).items||[];});lsSet("blocks",S.blocks);renderAll();},function(){});
  },function(){});
  window.claude.use("mcp").then(function(mcp){if(!mcp)return;mcpRef=mcp;renderAll();
    watch("context/dates.md",function(t){brain.dates=parseDates(t);renderAll();});
    watch("chief/board.md",function(t){brain.board=parseBoard(t).latest;renderFocus();});
  },function(){});
}

})();
